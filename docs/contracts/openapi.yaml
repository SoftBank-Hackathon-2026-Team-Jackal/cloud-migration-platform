components:
  schemas:
    AgentAdminStatus:
      properties:
        agent_id:
          type: string
          title: Agent Id
        owner_id:
          type: string
          title: Owner Id
        cluster_uid:
          type: string
          title: Cluster Uid
        last_seen_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Seen At
        revoked:
          type: boolean
          title: Revoked
      additionalProperties: false
      type: object
      required:
      - agent_id
      - owner_id
      - cluster_uid
      - last_seen_at
      - revoked
      title: AgentAdminStatus
    AgentJobView:
      properties:
        job_id:
          type: string
          title: Job Id
        mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Mode
        agent_id:
          type: string
          title: Agent Id
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - UNKNOWN
          - EXPIRED
          - CANCELLED
          title: Status
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
        cancel_requested:
          type: boolean
          title: Cancel Requested
      additionalProperties: false
      type: object
      required:
      - job_id
      - mode
      - agent_id
      - status
      - code
      - cancel_requested
      title: AgentJobView
    AgentList:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/AgentSummary'
          type: array
          title: Agents
      type: object
      required:
      - agents
      title: AgentList
    AgentStatus:
      properties:
        agent_id:
          type: string
          title: Agent Id
        owner_id:
          type: string
          title: Owner Id
        cluster_uid:
          type: string
          title: Cluster Uid
      additionalProperties: false
      type: object
      required:
      - agent_id
      - owner_id
      - cluster_uid
      title: AgentStatus
    AgentSummary:
      properties:
        agent_id:
          type: string
          title: Agent Id
        cluster_uid:
          type: string
          title: Cluster Uid
        last_seen_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Seen At
        online:
          type: boolean
          title: Online
        revoked:
          type: boolean
          title: Revoked
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        tunnel:
          anyOf:
          - $ref: '#/components/schemas/TunnelSummary'
          - type: 'null'
      type: object
      required:
      - agent_id
      - cluster_uid
      - last_seen_at
      - online
      - revoked
      - version
      - tunnel
      title: AgentSummary
    AnalysisInputV2:
      properties:
        result_ref:
          $ref: '#/components/schemas/VersionRef'
        requirements_ref:
          $ref: '#/components/schemas/ContentRef'
        source_refs:
          patternProperties:
            ^[A-Za-z][A-Za-z0-9_-]{0,47}$:
              $ref: '#/components/schemas/S3ArchiveRef'
          type: object
          title: Source Refs
        config_artifact_ref:
          anyOf:
          - $ref: '#/components/schemas/ContentRef'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - result_ref
      - requirements_ref
      - source_refs
      title: AnalysisInputV2
    ApprovalRequest:
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          title: Decision
        scope:
          type: string
          enum:
          - INFRASTRUCTURE
          - WORKLOADS
          - FULL
          title: Scope
        manifest_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Manifest Digest
        preview_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Preview Digest
      additionalProperties: false
      type: object
      required:
      - decision
      - scope
      - manifest_digest
      - preview_digest
      title: ApprovalRequest
    ApprovalResponse:
      properties:
        approval_id:
          type: string
          title: Approval Id
        plan_id:
          type: string
          title: Plan Id
        revision:
          type: integer
          title: Revision
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          title: Decision
        approver_id:
          type: string
          title: Approver Id
        scope:
          type: string
          enum:
          - INFRASTRUCTURE
          - WORKLOADS
          - FULL
          title: Scope
        delivery_status:
          type: string
          enum:
          - PENDING
          - DELIVERED
          - FAILED
          title: Delivery Status
        delivery_attempts:
          type: integer
          title: Delivery Attempts
        execution_status:
          type: string
          enum:
          - NOT_STARTED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - UNKNOWN
          title: Execution Status
        workflow_state:
          type: string
          title: Workflow State
      additionalProperties: false
      type: object
      required:
      - approval_id
      - plan_id
      - revision
      - decision
      - approver_id
      - scope
      - delivery_status
      - delivery_attempts
      - execution_status
      - workflow_state
      title: ApprovalResponse
    ApproveRequest:
      properties:
        analysis_version:
          type: string
          maxLength: 64
          minLength: 1
          title: Analysis Version
        approvals:
          additionalProperties:
            type: string
            enum:
            - APPROVED
            - REJECTED
          type: object
          minProperties: 1
          title: Approvals
        actor:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Actor
      additionalProperties: false
      type: object
      required:
      - analysis_version
      - approvals
      title: ApproveRequest
      description: 승인이 필요한 모든 항목(행 ID·`security:<기준>`)의 결정. 거절하면 그 기능은 필수가 된다.
    ApproverCredential:
      properties:
        approver_id:
          type: string
          title: Approver Id
        credential:
          type: string
          title: Credential
      additionalProperties: false
      type: object
      required:
      - approver_id
      - credential
      title: ApproverCredential
    ApproverGrant:
      properties:
        migration_ids:
          items:
            type: string
            minLength: 1
            pattern: ^\S(?:.*\S)?$
          type: array
          minItems: 1
          title: Migration Ids
      additionalProperties: false
      type: object
      required:
      - migration_ids
      title: ApproverGrant

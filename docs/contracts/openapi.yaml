    scaffold; their approval without Plan ID/Revision is not the production contract.
    Agent enrollment and outbound polling paths are implemented for the 04A registration
    boundary, without approved Production Apply. Plan Revision approval paths (ticket
    07) record an authenticated decision for an exact Plan ID, Revision and Digest
    and deliver it to Temporal; only a safe record-only executor is wired. Agreed
    capabilities and unresolved choices are recorded in x-sdd-*. This file does not
    define Temporal Client calls, Workflow/Activity Python contracts, Provider module
    APIs, or ProvisioningResult internals.
paths:
  /migrations:
    post:
      tags:
      - migration scaffold
      summary: Start Migration
      description: 'Start a migration. Unknown fields are 422.


        Without `target` this is the scaffold start: `env_file_ref` (from `POST /env-files`)
        is

        optional. With `target` (the web `StartRequest`, ticket 44) the real pipeline
        starts: `source`

        and `env_file_ref` (an `envf-` id, pinned to its latest version, or an exact
        reference) are

        required and the target profile catalog supplies the target settings. Refusals
        are

        `{"detail": {"code": ...}}`: 422 `SOURCE_REQUIRED`, `ENV_FILE_REF_REQUIRED`,

        `ENV_FILE_NOT_FOUND` | `ENV_FILE_DIGEST_MISMATCH` | `ENV_FILE_EXPIRED`, `TARGET_*`;
        503

        `TARGET_PROFILES_UNCONFIGURED`, `SANDBOX_SETTINGS_INVALID` (the server''s
        rehearsal shape is

        not a JSON object), `DATA_MIGRATION_SETTINGS_INVALID` (the server''s data-migration
        input is

        not a valid `DataMigrationInput`), `TRAFFIC_SETTINGS_INVALID` (the server''s
        traffic input is not

        a valid `TrafficShiftInput`) or the `.env` store codes. Nothing starts on
        a refusal.'

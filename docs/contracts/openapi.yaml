              format: binary
          text/plain:
            schema:
              type: string
    delete:
      tags:
      - env files
      summary: Delete Env File
      description: Delete every version now; later reads of any of its references
        are `ENV_FILE_EXPIRED`.
      operationId: delete_env_file_env_files__file_id__delete
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      - name: x-enrollment-admin-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Enrollment-Admin-Key
      responses:
        '204':
          description: Successful Response
        '403':
          description: Operator key missing or wrong
        '404':
          description: '`ENV_FILE_NOT_FOUND`'
        '503':
          description: '`ENV_FILE_STORE_UNCONFIGURED`'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:

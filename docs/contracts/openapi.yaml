x-sdd-contract-status:
  scope: Frontend and on-premises Agent to FastAPI REST and SSE
  implementation: Migration paths remain a scaffold; Agent enrollment and polling
    paths and Plan Revision approval paths are implemented. Approved ON_PREM rollout
    jobs, Agent artifact download and rollout status are implemented (ticket 12);
    AWS/GCP Production Apply is not.
  source-of-truth:
  - docs/product/policies.md
  - docs/architecture/domain-boundaries.md
  - specs/provisioning/spec.md
  agreed-source: AWS EKS
  agreed-targets:
    AWS: EKS
    GCP: GKE
    ON_PREM: K3s
  processing: Migration runs asynchronously through Temporal; HTTP creation does not
    wait for completion.
  storage-boundaries:
    business-records: PostgreSQL stores users, migrations, plans, and approvals.
    workflow-history: Temporal stores execution history and task state.
    artifacts: S3 stores uploaded files and large artifacts by reference.
  secret-boundary: Agent enrollment, Agent registration and approver registration
    return one-time tokens or credentials only in those dedicated responses. Do not
    log or return credential, .env, or Secret plaintext in ordinary responses.
x-sdd-agreed-capabilities:
- capability: on-prem-agent-enrollment
  purpose: An operator with the configured enrollment key issues a short-lived, one-use
    token for an owner and K3s Agent. The Agent registers outbound and receives its
    credential once; authenticated polling only returns work assigned to that Agent.
- capability: approver-registration
  purpose: An operator with the configured approval admin key registers an approver
    and its allowed migration IDs and receives the approver credential once; only
    its digest is stored. Interim until a user authentication system exists.
- capability: source-upload
  purpose: Accept application source for analysis and provide a later usable reference.
- capability: environment-upload
  purpose: Accept a separate .env file and provide a reference without repeating its
    plaintext in workflow inputs.
- capability: migration-create
  purpose: Accept source AWS access reference, uploaded source and .env references,
    target choice, and target access reference; start a Workflow and acknowledge receipt
    without waiting for completion.
- capability: migration-status
  purpose: Expose migration identity, overall and current-stage status, approval wait,
    failure or cancellation, and relevant result or artifact references.
- capability: provisioning-preview
  purpose: Show target, planned cluster and node, network and security, ingress, app
    and PostgreSQL resources, and validation results without Secret plaintext.
- capability: plan-approval
  purpose: 'Authorize only the reviewed Plan ID and Revision before production provisioning
    starts. Implemented (ticket 07): approver identity comes from an operator-issued
    Bearer credential, permission from the Plan migration grant; the body must repeat
    scope and manifest/preview Digests of the latest stored Revision. One decision
    per Revision; a repeated identical request returns the existing record (200).
    The response separates delivery_status, execution_status and workflow_state; delivery
    failure is returned as delivery_status=FAILED and can be retried via the delivery
    path.'
  errors:
    '401': APPROVER_AUTH_REQUIRED
    '403': APPROVER_FORBIDDEN
    '404': PLAN_NOT_FOUND | APPROVAL_NOT_FOUND
    '409': STALE_REVISION | APPROVAL_TARGET_MISMATCH | ALREADY_DECIDED | APPROVER_EXISTS
    '422': PLAN_NOT_APPROVABLE with approval_issues codes (LOCAL_STATE_* previews
      map to PENDING_DECISION or VALIDATION_FAILED)
- capability: approved-onprem-rollout
  purpose: After an approved ON_PREM Plan Revision is claimed for execution, one PRODUCTION_ROLLOUT
    job per Revision is queued for the Plan's registered Agent. The Agent claim returns
    it only while the business-DB approval, latest Revision and manifest Digest still
    match; otherwise the job is closed without reaching the Agent.
  paths:
    claim: POST /agents/{agent_id}/jobs/claim (payload is QueuedWork or ProductionRolloutJob)
    artifact: GET /agents/{agent_id}/jobs/{job_id}/artifacts/{sha256} returns exact
      Chart/Values bytes referenced by the caller's own RUNNING rollout job; the Agent
      verifies size and SHA-256 before use. 403 Agent unauthorized, 404 ARTIFACT_NOT_FOUND,
      409 ARTIFACT_UNAVAILABLE | ARTIFACT_DIGEST_MISMATCH, 503 store not configured.
    status: GET /provisioning/plans/{plan_id}/revisions/{revision}/rollout (approver
      Bearer with migration grant) returns NOT_DISPATCHED | WAITING_AGENT | RUNNING
      | READY | FAILED | UNKNOWN and a code. 401 APPROVER_AUTH_REQUIRED, 403 APPROVER_FORBIDDEN,
      404 PLAN_NOT_FOUND. Read-only; never starts or retries work.
  ready: READY only after Helm Releases, PVC Bound, workload readiness, Service endpoints,
    pg_isready and the app health path all pass inside the target. External access
    and data/function tests are not part of READY.
- capability: plan-rejection-or-revision-request
  purpose: Prevent the rejected plan from being applied. Implemented as decision=REJECT
    on the approval path; replanning and revision-request behavior is undecided.
- capability: migration-cancel-request
  purpose: Request execution cancellation; acceptance does not mean external resources
    were deleted or traffic rolled back.
- capability: migration-events
  purpose: Stream stage, approval, validation, error, and completion updates via FastAPI
    SSE without stopping the Workflow when a client disconnects.
x-sdd-unresolved-http-interface:
- URL paths and HTTP methods for migration product capabilities, including whether
  scaffold migration paths will be retained. Agent registration paths are implemented.
- Authentication and authorization model for uploads, migration ownership, preview
  and cancellation, and the replacement of interim approver credentials by a user
  identity system.
- Request and response field names, validation constraints, and external status enumeration.
- Upload transport, file type and size limits, scanning policy, retention, and reference
  format.
- Rejection follow-up and revision-request semantics, and how the top-level Migration
  Workflow consumes the per-Revision approval Workflow.
- HTTP status codes, public error codes, and mapping of validation, permission, planning,
  approval, provisioning, data, and traffic failures.
- SSE URL and event names, event source, reconnection cursor, replay and missed-event
  policy, and log redaction or pagination.
- Public summary of ProvisioningResult and the visibility rules for internal resource
  identifiers and artifact references.

      - env files
      summary: Upload Env File
      description: Store a new `.env`; returns `env_file_ref` (version 1) and the
        key names.
      operationId: upload_env_file_env_files_post
      parameters:
      - name: x-enrollment-admin-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Enrollment-Admin-Key
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvFileUploaded'
        '403':
          description: Operator key missing or wrong
        '404':
          description: '`ENV_FILE_NOT_FOUND`'
        '410':
          description: '`ENV_FILE_EXPIRED` (deleted or past retention)'
        '413':
          description: '`ENV_FILE_TOO_LARGE`'
        '422':
          description: '`ENV_FILE_NOT_UTF8`'
        '503':
          description: '`ENV_FILE_STORE_UNCONFIGURED`'
      requestBody:
        required: true
        description: Raw `.env` bytes, UTF-8, at most 64 KiB.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string

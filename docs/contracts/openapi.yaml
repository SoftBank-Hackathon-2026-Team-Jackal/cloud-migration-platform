                title: Response Health Health Get
components:
  schemas:
    AgentAdminStatus:
      properties:
        agent_id:
          type: string
          title: Agent Id
        owner_id:
          type: string
          title: Owner Id
        cluster_uid:
          type: string
          title: Cluster Uid
        last_seen_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Seen At
        revoked:
          type: boolean
          title: Revoked
      additionalProperties: false
      type: object
      required:
      - agent_id
      - owner_id
      - cluster_uid
      - last_seen_at
      - revoked
      title: AgentAdminStatus
    AgentList:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/AgentSummary'
          type: array
          title: Agents
      type: object
      required:
      - agents
      title: AgentList
    AgentStatus:
      properties:
        agent_id:
          type: string
          title: Agent Id
        owner_id:
          type: string
          title: Owner Id
        cluster_uid:
          type: string
          title: Cluster Uid
      additionalProperties: false
      type: object
      required:
      - agent_id
      - owner_id
      - cluster_uid
      title: AgentStatus
    AgentSummary:
      properties:
        agent_id:
          type: string
          title: Agent Id
        cluster_uid:
          type: string
          title: Cluster Uid
        last_seen_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Seen At
        online:
          type: boolean
          title: Online
        revoked:
          type: boolean
          title: Revoked
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        tunnel:
          anyOf:
          - $ref: '#/components/schemas/TunnelSummary'
          - type: 'null'
      type: object
      required:
      - agent_id
      - cluster_uid
      - last_seen_at
      - online
      - revoked
      - version
      - tunnel
      title: AgentSummary
    AnalysisInputV2:
      properties:
        result_ref:
          $ref: '#/components/schemas/VersionRef'
        requirements_ref:
          $ref: '#/components/schemas/ContentRef'
        source_refs:
          patternProperties:
            ^[A-Za-z][A-Za-z0-9_-]{0,47}$:
              $ref: '#/components/schemas/S3ArchiveRef'
          type: object
          title: Source Refs
        config_artifact_ref:
          anyOf:
          - $ref: '#/components/schemas/ContentRef'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - result_ref
      - requirements_ref
      - source_refs
      title: AnalysisInputV2
    ApprovalRequest:
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          title: Decision
        scope:
          type: string
          enum:
          - INFRASTRUCTURE
          - WORKLOADS
          - FULL
          title: Scope
        manifest_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Manifest Digest
        preview_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Preview Digest
      additionalProperties: false
      type: object
      required:
      - decision
      - scope
      - manifest_digest
      - preview_digest
      title: ApprovalRequest
    ApprovalResponse:
      properties:
        approval_id:
          type: string
          title: Approval Id
        plan_id:
          type: string
          title: Plan Id
        revision:
          type: integer
          title: Revision
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          title: Decision
        approver_id:
          type: string
          title: Approver Id
        scope:
          type: string
          enum:
          - INFRASTRUCTURE
          - WORKLOADS
          - FULL
          title: Scope
        delivery_status:
          type: string
          enum:
          - PENDING
          - DELIVERED
          - FAILED
          title: Delivery Status
        delivery_attempts:
          type: integer
          title: Delivery Attempts
        execution_status:
          type: string
          enum:
          - NOT_STARTED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - UNKNOWN
          title: Execution Status
        workflow_state:
          type: string
          title: Workflow State
      additionalProperties: false
      type: object
      required:
      - approval_id
      - plan_id
      - revision
      - decision
      - approver_id
      - scope
      - delivery_status
      - delivery_attempts
      - execution_status
      - workflow_state
      title: ApprovalResponse
    ApproverCredential:
      properties:
        approver_id:
          type: string
          title: Approver Id
        credential:
          type: string
          title: Credential
      additionalProperties: false
      type: object
      required:
      - approver_id
      - credential
      title: ApproverCredential
    ApproverRegistration:
      properties:
        approver_id:
          type: string
          minLength: 1
          pattern: ^\S(?:.*\S)?$
          title: Approver Id
        migration_ids:
          items:
            type: string
            minLength: 1
            pattern: ^\S(?:.*\S)?$
          type: array
          minItems: 1
          title: Migration Ids
      additionalProperties: false
      type: object
      required:
      - approver_id
      - migration_ids
      title: ApproverRegistration
    ArtifactRef:
      properties:
        id:
          type: string
          minLength: 1
          pattern: ^\S(?:.*\S)?$
          title: Id
        version:
          type: string
          minLength: 1
          pattern: ^\S(?:.*\S)?$
          title: Version
        kind:
          type: string
          enum:
          - SPEC
          - TERRAFORM_PLAN
          - CHART
          - VALUES
          - BINDINGS
          - MANIFEST
          title: Kind
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
      additionalProperties: false
      type: object
      required:
      - id
      - version
      - kind
      - sha256
      - size_bytes
      title: ArtifactRef
    AwsConnectionSummary:
      properties:
        connection_id:
          type: string
          title: Connection Id
        kind:
          type: string
          enum:
          - AWS_SOURCE
          - AWS_TARGET
          title: Kind
        display_name:
          type: string
          title: Display Name
        account_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Account Id
        region:
          type: string
          title: Region
        status:
          type: string
          enum:
          - PENDING
          - CONNECTED
          - FAILED
          title: Status
        last_verified_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Verified At
      type: object
      required:
      - connection_id
      - kind
      - display_name
      - account_id
      - region
      - status
      - last_verified_at
      title: AwsConnectionSummary
    AwsTargetSettings:
      properties:
        provider:
          type: string
          const: AWS
          title: Provider
        settings:
          additionalProperties: true
          type: object
          title: Settings
        workloads:
          anyOf:
          - $ref: '#/components/schemas/CloudWorkloadSettings'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - provider
      - settings
      title: AwsTargetSettings
    BuildEvidenceV2:
      properties:
        resource_id:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
          title: Resource Id
        result_ref:
          $ref: '#/components/schemas/VersionRef'
        status:
          type: string
          enum:
          - SUCCEEDED
          - FAILED
          title: Status
        source_ref:
          $ref: '#/components/schemas/S3ArchiveRef'
        image_uri:
          anyOf:
          - type: string
            pattern: ^[^\s@]+@sha256:[a-f0-9]{64}$
          - type: 'null'
          title: Image Uri
        image_digest:
          anyOf:
          - type: string
            pattern: ^sha256:[a-f0-9]{64}$
          - type: 'null'
          title: Image Digest
        platforms:
          items:
            type: string
            enum:
            - linux/amd64
            - linux/arm64
          type: array
          title: Platforms
      additionalProperties: false
      type: object
      required:
      - resource_id
      - result_ref
      - status
      - source_ref
      title: BuildEvidenceV2
    Check:
      properties:
        layer:
          type: string
          enum:
          - INFRASTRUCTURE
          - WORKLOAD
          - APPLICATION
          title: Layer
        name:
          type: string
          minLength: 1
          pattern: ^\S(?:.*\S)?$
          title: Name
        status:
          type: string
          enum:
          - PASSED
          - FAILED
          - NOT_RUN
          - UNKNOWN
          title: Status
        code:
          anyOf:
          - type: string
            minLength: 1
            pattern: ^\S(?:.*\S)?$
          - type: 'null'
          title: Code
        reason:

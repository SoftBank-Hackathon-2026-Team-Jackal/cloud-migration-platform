# Builds the demo control-plane images (api, worker) and pushes them to GHCR, tagged with the 12-char
# commit SHA that infra/demo/release.sh uses as the release name. Does not deploy anything.
# Runs on main pushes and manual dispatch only, with GITHUB_TOKEN. Every main push builds (no path
# filter) so any revision that can be deployed has its images; unchanged layers come from the cache.
# The web image is not built here: it needs NEXT_PUBLIC_* build args and lives in the web repository.
name: Build images
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Names
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/$owner/cmp-demo-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/demo/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          # Layer cache in GHCR: unchanged dependency/CLI layers (the worker's ~1.4 GB) are not rebuilt.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

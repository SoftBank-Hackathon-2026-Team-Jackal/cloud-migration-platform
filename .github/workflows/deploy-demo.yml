name: Deploy demo

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'main commit SHA to deploy; leave empty for current main'
        required: false
        type: string
      force:
        description: 'Deploy even while migrations are running (restarting the worker cancels them)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cmp-demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::714066696240:role/cmp-demo-github-deploy
          aws-region: ap-northeast-2
          allowed-account-ids: '714066696240'
      - name: Deploy selected main revision
        env:
          CMP_REQUESTED_REVISION: ${{ inputs.revision }}
          CMP_DEPLOY_FORCE: ${{ inputs.force && '1' || '' }}
        run: bash infra/demo/release.sh "${CMP_REQUESTED_REVISION:-HEAD}"
      # 중계 서버(relay worker·traffic-health)도 같은 커밋으로 맞춘다. 데모 서버 배포와 따로 두면 트래픽 코드가 어긋난다.
      - name: Sync relay host library
        env:
          CMP_REQUESTED_REVISION: ${{ inputs.revision }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: bash infra/relay/sync-lib.sh "${CMP_REQUESTED_REVISION:-HEAD}"

# On-premises Agent release (ticket 15, #69; decision H4).
# Push a tag `agent-vX.Y.Z` to publish:
#   - ghcr.io/<owner>/cmp-onprem-agent (linux/amd64 + linux/arm64)
#   - oci://ghcr.io/<owner>/charts/onprem-agent:X.Y.Z with image.digest pinned
#   - a GitHub Release with the Chart .tgz, the image digest and install commands
# The packages are meant to be public once the repository is public (H4).
name: Agent release
on:
  push:
    tags: ["agent-v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and names
        id: meta
        run: |
          version="${GITHUB_REF_NAME#agent-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must be agent-vX.Y.Z" >&2; exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/cmp-onprem-agent" >> "$GITHUB_OUTPUT"
          echo "charts=oci://ghcr.io/$owner/charts" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv sync --extra dev --locked
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Agent and Chart tests
        run: uv run pytest tests/test_agent_runtime.py tests/test_agent_lifecycle.py tests/test_onprem_agent.py tests/test_onprem_agent_chart.py

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/onprem-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Package and push Chart
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          CHARTS: ${{ steps.meta.outputs.charts }}
        run: |
          uv run python scripts/package_agent_chart.py \
            --version "$VERSION" --image-digest "$DIGEST" --repository "$IMAGE" --out dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/onprem-agent-$VERSION.tgz" "$CHARTS"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          CHARTS: ${{ steps.meta.outputs.charts }}
        run: |
          cat > notes.md <<NOTES
          On-premises Agent $VERSION

          - Image: \`$IMAGE@$DIGEST\` (linux/amd64, linux/arm64)
          - Chart: \`$CHARTS/onprem-agent\` version \`$VERSION\` (image digest pinned)

          Install (first time; the token is issued by the platform operator):

          \`\`\`bash
          helm install cmp-agent $CHARTS/onprem-agent --version $VERSION -n cmp-system --create-namespace --set agentId=<agent-id> --set platform.url=https://<platform> --set enrollmentToken=<token>
          \`\`\`

          See docs: specs/provisioning/onprem-agent-install.md
          NOTES
          gh release create "$GITHUB_REF_NAME" "dist/onprem-agent-$VERSION.tgz" \
            --title "On-premises Agent $VERSION" --notes-file notes.md

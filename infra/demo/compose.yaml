name: cmp-demo

services:
  platform-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD}
      POSTGRES_DB: platform
    volumes:
      - /opt/cmp/data/platform-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      retries: 12

  temporal-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
    volumes:
      - /opt/cmp/data/temporal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 12

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: temporal-db

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8080:8080"

  api:
    build:
      context: ../..
      dockerfile: infra/demo/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      platform-db:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://platform:${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD}@platform-db:5432/platform
      TEMPORAL_ADDRESS: temporal:7233
      AGENT_ENROLLMENT_ADMIN_KEY: ${AGENT_ENROLLMENT_ADMIN_KEY:?set AGENT_ENROLLMENT_ADMIN_KEY}
      APPROVAL_ADMIN_KEY: ${APPROVAL_ADMIN_KEY:?set APPROVAL_ADMIN_KEY}
      # Ticket 60 A12: an existing approver that each new Migration is granted to at start
      # (web PLATFORM_APPROVER_TOKEN). Empty: no automatic grant; use approver-token.py grant.
      DEMO_APPROVER_ID: ${DEMO_APPROVER_ID:-}
      # Shared with the worker at the same paths (ticket 21): digest-named rollout bytes and Plan
      # Revision directories `<plan_id>-r<revision>/`.
      ARTIFACT_STORE_DIR: /opt/cmp/artifact-store
      PROVISIONING_ARTIFACT_ROOT: /opt/cmp/plans
      # Ticket 41 (#176): the platform principal for K3s Agent ECR pull tokens (ticket 29) and
      # environment connections (ticket 23) is the instance-role build profile from
      # ensure-secrets.sh; no static keys and no GCP credentials on the API.
      AWS_CONFIG_FILE: /run/cmp/aws/config
      CONNECTION_PLATFORM_AWS_PROFILE: cmp-demo-build
      # Ticket 23b (#205): the Launch Stack link (null while either is empty). Values from
      # /opt/cmp/.env, printed by deploy-connection-templates.sh: the instance role's ARN (the
      # identity the profile above resolves to) and the public connections/<version> prefix of
      # the template bucket. API only; the worker never builds the link.
      CONNECTION_PLATFORM_PRINCIPAL_ARN: ${CONNECTION_PLATFORM_PRINCIPAL_ARN:-}
      CONNECTION_TEMPLATE_BASE_URL: ${CONNECTION_TEMPLATE_BASE_URL:-}
      # Ticket 46 (#181): the API writes the generated connection profiles (`cmp-conn-*`, whose
      # credential_source = the instance role, as cmp-demo-build) here; the worker reads the same file.
      CONNECTION_AWS_CONFIG_FILE: /run/cmp/aws-connections/config
      CONNECTION_AWS_BASE_CONFIG_FILE: /run/cmp/aws/config
      # K3s Agent ECR pull tokens. Ticket 47 (B-09): cmp-demo-ecr-pull (pull-only role) once
      # /opt/cmp/.env has the deploy-build-stack.sh lines; until then the build profile (41).
      PLATFORM_ECR_AWS_PROFILE: ${PLATFORM_ECR_AWS_PROFILE:-cmp-demo-build}
      # Platform registry for ON_PREM rollout jobs, from /opt/cmp/.env (deploy-build-stack.sh
      # prints it). Empty keeps the pre-ticket-29 behavior (no platform registry). The worker
      # gets the same two lines (it builds the rollout jobs; the api mints the pull tokens).
      PLATFORM_ECR_REGISTRY: ${PLATFORM_ECR_REGISTRY:-}
      PLATFORM_ECR_REPOSITORIES: ${PLATFORM_ECR_REPOSITORIES:-cmp-platform-builds}
      # Ticket 44 (#179): target profile catalog for web starts (shape:
      # target-profiles.example.json). Absent file → real starts are 503
      # TARGET_PROFILES_UNCONFIGURED; the scaffold start still works.
      PLANNING_TARGET_PROFILES_FILE: /opt/cmp/config/target-profiles.json
      # Ticket 45 (#180, N12): uploaded `.env` files (ENV-01), encrypted under this directory.
      # The base64url 32-byte key is generated once by ensure-secrets.sh and never rotated
      # (a new key makes every stored upload unreadable). Same store/key as the worker.
      ENV_FILE_STORE_DIR: /opt/cmp/env-files
      ENV_FILE_ENCRYPTION_KEY: ${ENV_FILE_ENCRYPTION_KEY:?set ENV_FILE_ENCRYPTION_KEY}
      # Ticket 57 (#228): the rehearsal's standard write -> read shape for web starts, a
      # SandboxSettings JSON object in /opt/cmp/.env (demo-app line: runtime.env.example). Empty:
      # the rehearsal runs the health test only (today's behavior).
      WEB_START_SANDBOX_SETTINGS: ${WEB_START_SANDBOX_SETTINGS:-}
      # Data-migration ticket 08: the data step's input for web starts, a DataMigrationInput JSON
      # object in /opt/cmp/.env (source DB, source app, cutover settings, target tunnel address;
      # no secrets). Empty: the data step stays the scaffold (today's behavior).
      WEB_START_DATA_MIGRATION: ${WEB_START_DATA_MIGRATION:-}
      # #128: the traffic step's input for web starts, a TrafficShiftInput JSON object in
      # /opt/cmp/.env (relay worker queue, step policy; no secrets). Empty: the traffic step stays
      # the scaffold and the relay server is never touched (today's behavior).
      WEB_START_TRAFFIC: ${WEB_START_TRAFFIC:-}
      # Provisioning 73/78 (ADR-007 2안): expose the K3s API on every Agent tunnel IP so the
      # data worker reaches on-prem k3d through the relay (Agent Chart tunnel.exposeKubeApi too).
      # Off unless /opt/cmp/.env sets TUNNEL_EXPOSE_KUBE_API=true.
      TUNNEL_EXPOSE_KUBE_API: ${TUNNEL_EXPOSE_KUBE_API:-false}
      TUNNEL_KUBE_API_PORT: ${TUNNEL_KUBE_API_PORT:-6443}
      # Agent chat (`POST /agent/ask`, called only by the web server; the public edge does not route it).
      # Off unless /opt/cmp/.env sets AGENT_CHAT_ENABLED=true. It shares the worker's spend ledger and
      # kill switch (`touch /opt/cmp/data/llm/disabled`), so one budget covers every model call.
      AGENT_CHAT_ENABLED: ${AGENT_CHAT_ENABLED:-false}
      AGENT_MODEL: ${AGENT_CHAT_MODEL:-claude-haiku-5-5}
      AGENT_CAPTION_MODEL: ${AGENT_CHAT_CAPTION_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_LEDGER_PATH: /opt/cmp/llm/ledger.json
      LLM_KILL_SWITCH_PATH: /opt/cmp/llm/disabled
    volumes:
      - /opt/cmp/data/artifact-store:/opt/cmp/artifact-store
      - /opt/cmp/data/llm:/opt/cmp/llm
      - /opt/cmp/data/plans:/opt/cmp/plans
      - /opt/cmp/data/env-files:/opt/cmp/env-files
      - /opt/cmp/secrets/aws:/run/cmp/aws:ro
      # Ticket 46: no keys in it (ARNs, External IDs, profile names), so it lives with the data.
      - /opt/cmp/data/aws-connections:/run/cmp/aws-connections
      - /opt/cmp/config:/opt/cmp/config:ro
    command: ["uvicorn", "cmp_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Loopback only; the public edge forwards /agents/*, /relays/*, /migrations[/*] and /provisioning/*
    # on the internal network.
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ../..
      dockerfile: infra/demo/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      platform-db:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://platform:${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD}@platform-db:5432/platform
      TEMPORAL_ADDRESS: temporal:7233
      ARTIFACT_STORE_DIR: /opt/cmp/artifact-store
      PROVISIONING_ARTIFACT_ROOT: /opt/cmp/plans
      # AWS: named profiles backed by the EC2 instance role (ensure-secrets.sh) plus the API's
      # generated connection profiles `cmp-conn-*` (ticket 46); no static keys.
      AWS_CONFIG_FILE: /run/cmp/aws-connections/config
      PROVISIONING_AWS_PROFILE: ${PROVISIONING_AWS_PROFILE:-cmp-demo-provisioning}
      # Ticket 47 (D-10): the demo host EIP as /32 in /opt/cmp/.env; AWS Plans then refuse
      # api_access_cidrs that leave it out. Empty = not checked (Preview warning).
      PROVISIONING_PLATFORM_EGRESS_CIDRS: ${PROVISIONING_PLATFORM_EGRESS_CIDRS:-}
      # GCP: operator-provided service-account key, activated by the entrypoint into tmpfs. The same
      # ADC serves GCP Plan/Apply and the API's GCP_TARGET connection check (ticket 48 Activity).
      CMP_GCP_KEY_FILE: /run/cmp/gcp/key.json
      CMP_GCP_PROJECT: ${CMP_GCP_PROJECT:-}
      PROVISIONING_GCLOUD_CONFIGURATION: cmp-demo
      # Ticket 47 (B-09, 41 D4): GKE pull Secret tokens, same pull profile as the api.
      PLATFORM_ECR_AWS_PROFILE: ${PLATFORM_ECR_AWS_PROFILE:-cmp-demo-build}
      # ON_PREM rollout jobs are built here (execute_on_prem_plan → build_rollout_job), which
      # reads the API settings: without the same registry, ECR app images are refused with
      # IMAGE_REGISTRY_NOT_ALLOWED. Same /opt/cmp/.env source as the api.
      PLATFORM_ECR_REGISTRY: ${PLATFORM_ECR_REGISTRY:-}
      PLATFORM_ECR_REPOSITORIES: ${PLATFORM_ECR_REPOSITORIES:-cmp-platform-builds}
      # Ticket 28 (#152): the Build module. Names only, from /opt/cmp/.env (deploy-build-stack.sh
      # prints them); all empty keeps the pre-built images. Ticket 47 (B-20): the Build module
      # passes BUILD_AWS_PROFILE to its own `aws` calls; no global AWS_PROFILE.
      BUILD_ECR_REPOSITORY: ${BUILD_ECR_REPOSITORY:-}
      BUILD_SOURCE_BUCKET: ${BUILD_SOURCE_BUCKET:-}
      BUILD_LOG_BUCKET: ${BUILD_LOG_BUCKET:-}
      BUILD_PLATFORM: ${BUILD_PLATFORM:-}
      BUILD_AWS_PROFILE: cmp-demo-build
      # Ticket 45 (#180, N12): the same `.env` store as the API (EnvPlan names, render_env). The worker
      # never writes uploads, but the store sets its root to 0700 when opened, so the mount is not :ro.
      ENV_FILE_STORE_DIR: /opt/cmp/env-files
      ENV_FILE_ENCRYPTION_KEY: ${ENV_FILE_ENCRYPTION_KEY:?set ENV_FILE_ENCRYPTION_KEY}
      # Ticket 45 (A-03, D-08): analysis and Sandbox settings, names only; values in /opt/cmp/.env
      # (lines: runtime.env.example). Empty keeps today's scaffold registrations. The real analysis
      # Activities reuse the scaffold names with dict arguments, so one worker serves one path:
      # both ANALYSIS_* lines → web (`target`) starts analyse for real and the scaffold start
      # fails in analysis. ANALYSIS_ARTIFACT_STORE_DIR must equal ARTIFACT_STORE_DIR (Planning
      # reads the requirements there).
      ANALYSIS_ARTIFACT_STORE_DIR: ${ANALYSIS_ARTIFACT_STORE_DIR:-}
      ANALYSIS_WORKSPACE_ROOT: ${ANALYSIS_WORKSPACE_ROOT:-}
      # Real Sandbox loop: kubeconfig of the dedicated `k3d-cmp-sandbox` cluster, placed by the
      # operator at /opt/cmp/secrets/sandbox/kubeconfig → /run/cmp/sandbox/kubeconfig. A set path
      # without the file stops the worker at start-up (SANDBOX_KUBECONFIG_NOT_FOUND).
      SANDBOX_KUBECONFIG: ${SANDBOX_KUBECONFIG:-}
      SANDBOX_PREBUILT_IMAGES: ${SANDBOX_PREBUILT_IMAGES:-}
      # Provisioning 72 (ADR-007 단계 6): cluster access of the data-migration Activities. The AWS
      # profile is `cmp-demo-data-migration` (ensure-secrets.sh writes it from DATA_MIGRATION_ROLE_ARN);
      # KUBECONFIG access reads <dir>/<kubeconfig_ref>.yaml from the read-only mount
      # /opt/cmp/secrets/data-migration → /run/cmp/data-migration. Empty: EKS/kubeconfig access fails
      # closed (no default profile, DbAccessNotConfigured).
      DATA_MIGRATION_AWS_PROFILE: ${DATA_MIGRATION_AWS_PROFILE:-}
      DATA_MIGRATION_KUBECONFIG_DIR: ${DATA_MIGRATION_KUBECONFIG_DIR:-}
      # Claude (ADR-004): off unless LLM_ENABLED=true and a key is set; spend ledger and kill
      # switch (`touch /opt/cmp/data/llm/disabled`) live on the host.
      LLM_ENABLED: ${LLM_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_LEDGER_PATH: /opt/cmp/llm/ledger.json
      LLM_KILL_SWITCH_PATH: /opt/cmp/llm/disabled
    volumes:
      - /opt/cmp/data/artifact-store:/opt/cmp/artifact-store
      - /opt/cmp/data/plans:/opt/cmp/plans
      - /opt/cmp/data/env-files:/opt/cmp/env-files
      - /opt/cmp/data/analysis-workspaces:/opt/cmp/analysis-workspaces
      - /opt/cmp/data/llm:/opt/cmp/llm
      - /opt/cmp/secrets/aws:/run/cmp/aws:ro
      - /opt/cmp/data/aws-connections:/run/cmp/aws-connections:ro
      - /opt/cmp/secrets/gcp:/run/cmp/gcp:ro
      - /opt/cmp/secrets/sandbox:/run/cmp/sandbox:ro
      - /opt/cmp/secrets/data-migration:/run/cmp/data-migration:ro
      # Ticket 28: builds run on the host daemon. Whoever holds this socket is root-equivalent on
      # the host; only the worker gets it (production: rootless BuildKit, see README).
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /root/.config/gcloud:mode=0700
      - /root/.aws:mode=0700
      - /root/.kube:mode=0700

  # Web front end (cloud-migration-web). Internal only: the edge forwards every path except /agents/*,
  # /relays/*, /migrations[/*] and /provisioning/* here, and its server code reaches the API at
  # http://api:8000. Opt-in like the edge. Built on
  # the host from /opt/cmp/web/current, which infra/demo/release-web.sh uploads and extracts. Operator-only
  # values (GitHub OAuth app id/secret, optional GEMINI_API_KEY) go in /opt/cmp/web.env (0600). The web does
  # NOT get AGENT_ENROLLMENT_ADMIN_KEY: its /api/agents routes have no user login yet, so a public web holding
  # the key would let anyone mint Agent enrollments (without it the connections screens use their mock data).
  # Ticket 45: the same single operator key guards /connections, /agent-enrollments and /env-files, and a real
  # web start needs an uploaded `.env` (ENV_FILE_REF_REQUIRED). Real mode therefore means the operator puts
  # PLATFORM_ENROLLMENT_ADMIN_KEY in /opt/cmp/web.env once the web guards those routes (README, approval).
  web:
    build:
      context: ${CMP_WEB_DIR:-/opt/cmp/web/current}
      # NEXT_PUBLIC_* are compiled into the browser bundle, so they are build args, not environment.
      # Real (SSE) mode: the browser calls POST /migrations and the SSE stream on the public host,
      # which the edge must forward to the API (agent-routes.caddy).
      args:
        NEXT_PUBLIC_API_MODE: sse
        NEXT_PUBLIC_SSE_START: source
        NEXT_PUBLIC_API_BASE: https://${CMP_PUBLIC_HOST:-localhost}
        # Ticket 77: real-mode screens whose platform API exists (GET .../report, POST .../traffic/
        # rollback|retry). sandbox.retry has no API yet. /opt/cmp/.env WEB_SSE_CAPABILITIES overrides
        # (comma list, `none` = all off); a change needs a web rebuild.
        NEXT_PUBLIC_SSE_CAPABILITIES: ${WEB_SSE_CAPABILITIES:-report,traffic.rollback,traffic.retry}
    restart: unless-stopped
    profiles: ["public"]
    depends_on:
      - api
    environment:
      PLATFORM_API_BASE: http://api:8000
      PLATFORM_PUBLIC_URL: https://${CMP_PUBLIC_HOST:-localhost}
      AUTH_SECRET: ${WEB_AUTH_SECRET:-}
      AUTH_URL: https://${CMP_PUBLIC_HOST:-localhost}
      AUTH_TRUST_HOST: "true"
      # An sse build would otherwise switch the connection/Agent screens to the real API, which needs the
      # operator key the public web does not hold (503). Keep the mock screens unless /opt/cmp/.env says
      # WEB_PLATFORM_CONNECTIONS=real (and web.env holds the key).
      PLATFORM_CONNECTIONS: ${WEB_PLATFORM_CONNECTIONS:-mock}
    env_file:
      - path: /opt/cmp/web.env
        required: false
    volumes:
      - /opt/cmp/data/web-models:/models
      - /opt/cmp/data/web-cache:/cache
    expose:
      - "3000"

  # Public HTTPS entry (ticket 21). Opt-in: start.sh starts it only when CMP_PUBLIC_HOST is set.
  # /agents/*, /relays/*, /migrations[/*] and /provisioning/* go to the API (#225); everything else goes
  # to the web front end.
  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    profiles: ["public"]
    depends_on:
      - api
      - temporal
    environment:
      CMP_PUBLIC_HOST: ${CMP_PUBLIC_HOST:-}
      CMP_API_UPSTREAM: api:8000
      CMP_WEB_UPSTREAM: web:3000
      CMP_TEMPORAL_UPSTREAM: temporal:7233
      # Relay host address allowed to reach Temporal through the edge (default: nobody).
      CMP_TEMPORAL_ALLOWED_IP: ${CMP_TEMPORAL_ALLOWED_IP:-192.0.2.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./agent-routes.caddy:/etc/caddy/agent-routes.caddy:ro
      - /opt/cmp/data/caddy:/data
    ports:
      - "443:443"

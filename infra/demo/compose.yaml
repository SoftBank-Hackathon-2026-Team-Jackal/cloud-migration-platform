name: cmp-demo

services:
  platform-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD}
      POSTGRES_DB: platform
    volumes:
      - /opt/cmp/data/platform-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      retries: 12

  temporal-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
    volumes:
      - /opt/cmp/data/temporal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 12

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: temporal-db

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8080:8080"

  api:
    build:
      context: ../..
      dockerfile: infra/demo/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      platform-db:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://platform:${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD}@platform-db:5432/platform
      TEMPORAL_ADDRESS: temporal:7233
      AGENT_ENROLLMENT_ADMIN_KEY: ${AGENT_ENROLLMENT_ADMIN_KEY:?set AGENT_ENROLLMENT_ADMIN_KEY}
      APPROVAL_ADMIN_KEY: ${APPROVAL_ADMIN_KEY:?set APPROVAL_ADMIN_KEY}
      # Shared with the worker at the same paths (ticket 21): digest-named rollout bytes and Plan
      # Revision directories `<plan_id>-r<revision>/`.
      ARTIFACT_STORE_DIR: /opt/cmp/artifact-store
      PROVISIONING_ARTIFACT_ROOT: /opt/cmp/plans
      # Ticket 41 (#176): the platform principal for K3s Agent ECR pull tokens (ticket 29) and
      # environment connections (ticket 23) is the instance-role build profile from
      # ensure-secrets.sh; no static keys and no GCP credentials on the API.
      AWS_CONFIG_FILE: /run/cmp/aws/config
      CONNECTION_PLATFORM_AWS_PROFILE: cmp-demo-build
      # Ticket 23b (#205): the Launch Stack link (null while either is empty). Values from
      # /opt/cmp/.env, printed by deploy-connection-templates.sh: the instance role's ARN (the
      # identity the profile above resolves to) and the public connections/<version> prefix of
      # the template bucket. API only; the worker never builds the link.
      CONNECTION_PLATFORM_PRINCIPAL_ARN: ${CONNECTION_PLATFORM_PRINCIPAL_ARN:-}
      CONNECTION_TEMPLATE_BASE_URL: ${CONNECTION_TEMPLATE_BASE_URL:-}
      # Ticket 46 (#181): the API writes the generated connection profiles (`cmp-conn-*`, whose
      # source_profile is cmp-demo-build = the instance role) here; the worker reads the same file.
      CONNECTION_AWS_CONFIG_FILE: /run/cmp/aws-connections/config
      CONNECTION_AWS_BASE_CONFIG_FILE: /run/cmp/aws/config
      # K3s Agent ECR pull tokens stay with the instance-role build profile (ticket 41).
      PLATFORM_ECR_AWS_PROFILE: cmp-demo-build
      # Platform registry for ON_PREM rollout jobs, from /opt/cmp/.env (deploy-build-stack.sh
      # prints it). Empty keeps the pre-ticket-29 behavior (no platform registry).
      PLATFORM_ECR_REGISTRY: ${PLATFORM_ECR_REGISTRY:-}
      PLATFORM_ECR_REPOSITORIES: ${PLATFORM_ECR_REPOSITORIES:-cmp-platform-builds}
      # Ticket 44 (#179): target profile catalog for web starts (shape:
      # target-profiles.example.json). Absent file → real starts are 503
      # TARGET_PROFILES_UNCONFIGURED; the scaffold start still works.
      PLANNING_TARGET_PROFILES_FILE: /opt/cmp/config/target-profiles.json
    volumes:
      - /opt/cmp/data/artifact-store:/opt/cmp/artifact-store
      - /opt/cmp/data/plans:/opt/cmp/plans
      - /opt/cmp/secrets/aws:/run/cmp/aws:ro
      # Ticket 46: no keys in it (ARNs, External IDs, profile names), so it lives with the data.
      - /opt/cmp/data/aws-connections:/run/cmp/aws-connections
      - /opt/cmp/config:/opt/cmp/config:ro
    command: ["uvicorn", "cmp_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Loopback only; the public edge forwards /agents/* and /relays/* on the internal network.
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ../..
      dockerfile: infra/demo/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      platform-db:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://platform:${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD}@platform-db:5432/platform
      TEMPORAL_ADDRESS: temporal:7233
      ARTIFACT_STORE_DIR: /opt/cmp/artifact-store
      PROVISIONING_ARTIFACT_ROOT: /opt/cmp/plans
      # AWS: named profiles backed by the EC2 instance role (ensure-secrets.sh) plus the API's
      # generated connection profiles `cmp-conn-*` (ticket 46); no static keys.
      AWS_CONFIG_FILE: /run/cmp/aws-connections/config
      PROVISIONING_AWS_PROFILE: ${PROVISIONING_AWS_PROFILE:-cmp-demo-provisioning}
      # GCP: operator-provided service-account key, activated by the entrypoint into tmpfs.
      CMP_GCP_KEY_FILE: /run/cmp/gcp/key.json
      CMP_GCP_PROJECT: ${CMP_GCP_PROJECT:-}
      PROVISIONING_GCLOUD_CONFIGURATION: cmp-demo
      # Ticket 28 (#152): the Build module. Names only, from /opt/cmp/.env (deploy-build-stack.sh
      # prints them); all empty keeps the pre-built images. The Build module's own `aws` calls take
      # the process profile, so AWS_PROFILE names the instance-role build profile explicitly.
      BUILD_ECR_REPOSITORY: ${BUILD_ECR_REPOSITORY:-}
      BUILD_SOURCE_BUCKET: ${BUILD_SOURCE_BUCKET:-}
      BUILD_LOG_BUCKET: ${BUILD_LOG_BUCKET:-}
      BUILD_PLATFORM: ${BUILD_PLATFORM:-}
      BUILD_AWS_PROFILE: cmp-demo-build
      AWS_PROFILE: cmp-demo-build
    volumes:
      - /opt/cmp/data/artifact-store:/opt/cmp/artifact-store
      - /opt/cmp/data/plans:/opt/cmp/plans
      - /opt/cmp/secrets/aws:/run/cmp/aws:ro
      - /opt/cmp/data/aws-connections:/run/cmp/aws-connections:ro
      - /opt/cmp/secrets/gcp:/run/cmp/gcp:ro
      # Ticket 28: builds run on the host daemon. Whoever holds this socket is root-equivalent on
      # the host; only the worker gets it (production: rootless BuildKit, see README).
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /root/.config/gcloud:mode=0700
      - /root/.aws:mode=0700
      - /root/.kube:mode=0700

  # Web front end (cloud-migration-web). Internal only: the edge forwards every path except /agents/* and
  # /relays/* here, and its server code reaches the API at http://api:8000. Opt-in like the edge. Built on
  # the host from /opt/cmp/web/current, which infra/demo/release-web.sh uploads and extracts. Operator-only
  # values (GitHub OAuth app id/secret, optional GEMINI_API_KEY) go in /opt/cmp/web.env (0600). The web does
  # NOT get AGENT_ENROLLMENT_ADMIN_KEY: its /api/agents routes have no user login yet, so a public web holding
  # the key would let anyone mint Agent enrollments (without it the connections screens use their mock data).
  web:
    build:
      context: ${CMP_WEB_DIR:-/opt/cmp/web/current}
    restart: unless-stopped
    profiles: ["public"]
    depends_on:
      - api
    environment:
      PLATFORM_API_BASE: http://api:8000
      PLATFORM_PUBLIC_URL: https://${CMP_PUBLIC_HOST:-localhost}
      AUTH_SECRET: ${WEB_AUTH_SECRET:-}
      AUTH_URL: https://${CMP_PUBLIC_HOST:-localhost}
      AUTH_TRUST_HOST: "true"
    env_file:
      - path: /opt/cmp/web.env
        required: false
    volumes:
      - /opt/cmp/data/web-models:/models
      - /opt/cmp/data/web-cache:/cache
    expose:
      - "3000"

  # Public HTTPS entry (ticket 21). Opt-in: start.sh starts it only when CMP_PUBLIC_HOST is set.
  # /agents/* and /relays/* go to the API; everything else goes to the web front end.
  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    profiles: ["public"]
    depends_on:
      - api
      - temporal
    environment:
      CMP_PUBLIC_HOST: ${CMP_PUBLIC_HOST:-}
      CMP_API_UPSTREAM: api:8000
      CMP_WEB_UPSTREAM: web:3000
      CMP_TEMPORAL_UPSTREAM: temporal:7233
      # Relay host address allowed to reach Temporal through the edge (default: nobody).
      CMP_TEMPORAL_ALLOWED_IP: ${CMP_TEMPORAL_ALLOWED_IP:-192.0.2.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./agent-routes.caddy:/etc/caddy/agent-routes.caddy:ro
      - /opt/cmp/data/caddy:/data
    ports:
      - "443:443"

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CMP demo build registry and Sandbox storage access (ticket 28, #152). A separate stack: it adds
  an inline policy to the EXISTING control-plane instance role and never updates
  cmp-demo-control-plane.

Parameters:
  InstanceRoleName:
    Type: String
    Description: Name of the existing demo EC2 instance role (cmp-demo-control-plane InstanceRole).
    AllowedPattern: '^[\w+=,.@-]{1,64}$'
  DeployBucketName:
    Type: String
    Description: Existing deploy bucket; releases/ stays read-only.
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  RepositoryName:
    Type: String
    Default: cmp-platform-builds
    AllowedPattern: '^[a-z0-9]+(?:[._-][a-z0-9]+)*$'
  # Key prefixes the worker writes today (confirm with the Sandbox owner before changing):
  # package_source -> sources/<sha>.tar.gz, upload_suite -> tests/<sha>.tar.gz,
  # ImageBuilder log -> builds/<migration>/<resource>/<attempt>.json.
  SourcePrefix:
    Type: String
    Default: sources
    AllowedPattern: '^[A-Za-z0-9_-]+$'
  SuitePrefix:
    Type: String
    Default: tests
    AllowedPattern: '^[A-Za-z0-9_-]+$'
  LogPrefix:
    Type: String
    Default: builds
    AllowedPattern: '^[A-Za-z0-9_-]+$'
  UntaggedImageDays:
    Type: Number
    Default: 7
    MinValue: 1
  # Ticket 47 (B-08): other AWS accounts whose platform-built EKS node roles may pull. The
  # operator adds a target connection's account here (deploy-build-stack.sh
  # CMP_ECR_PULL_ACCOUNT_IDS). Empty: no repository policy (same-account nodes need none).
  PullAccountIds:
    Type: CommaDelimitedList
    Default: ''

Conditions:
  HasPullAccounts: !Not [!Equals [!Join ['', !Ref PullAccountIds], '']]

Rules:
  ReleasesStayReadOnly:
    Assertions:
      - Assert: !Not [!Equals [!Ref SourcePrefix, releases]]
        AssertDescription: releases/ belongs to the deploy pipeline.
      - Assert: !Not [!Equals [!Ref SuitePrefix, releases]]
        AssertDescription: releases/ belongs to the deploy pipeline.
      - Assert: !Not [!Equals [!Ref LogPrefix, releases]]
        AssertDescription: releases/ belongs to the deploy pipeline.

Resources:
  BuildRepository:
    Type: AWS::ECR::Repository
    # Images are pinned by digest in approved Plans; never delete them with the stack.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # Ticket 47 (B-08): cross-account pull for the node role Terraform creates
      # (infra/terraform/aws `${name}-eks-node`, connection clusters are named cmp-*), only in the
      # listed accounts. The node role has AmazonEC2ContainerRegistryPullOnly in its own account.
      RepositoryPolicyText: !If
        - HasPullAccounts
        - Version: '2012-10-17'
          Statement:
            - Sid: TargetEksNodesPull
              Effect: Allow
              Principal: '*'
              Action:
                - ecr:BatchGetImage
                - ecr:GetDownloadUrlForLayer
                - ecr:BatchCheckLayerAvailability
              Condition:
                StringEquals:
                  aws:PrincipalAccount: !Ref PullAccountIds
                ArnLike:
                  aws:PrincipalArn: arn:aws:iam::*:role/cmp-*-eks-node
        - !Ref AWS::NoValue
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {"rules": [{"rulePriority": 1,
            "description": "Expire untagged images (failed or superseded pushes)",
            "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed",
                          "countUnit": "days", "countNumber": ${UntaggedImageDays}},
            "action": {"type": "expire"}}]}
      Tags:
        - Key: Project
          Value: cloud-migration-platform
        - Key: Purpose
          Value: hackathon-demo-builds

  BuildAccessPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref InstanceRoleName
      PolicyName: cmp-demo-build
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # The registry login token cannot be scoped to a repository.
          - Sid: EcrLogin
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPull
            Effect: Allow
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchCheckLayerAvailability
              - ecr:DescribeImages
              - ecr:DescribeRepositories
            Resource: !GetAtt BuildRepository.Arn
          - Sid: EcrPush
            Effect: Allow
            Action:
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
            Resource: !GetAtt BuildRepository.Arn
          # HeadObject answers 404 (not 403) for a missing key only with ListBucket, and S3 does
          # not pass s3:prefix for that check, so a prefix condition here would break the
          # "upload only when missing" step. Listing shows key names only.
          - Sid: SandboxList
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${DeployBucketName}'
          - Sid: SandboxObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${DeployBucketName}/${SourcePrefix}/*'
              - !Sub 'arn:${AWS::Partition}:s3:::${DeployBucketName}/${SuitePrefix}/*'
              - !Sub 'arn:${AWS::Partition}:s3:::${DeployBucketName}/${LogPrefix}/*'
          # Ticket 47 (B-09): pull tokens for user clusters come from the pull-only role.
          - Sid: AssumeEcrPullRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt EcrPullRole.Arn

  # Ticket 47 (B-09, 41 D4): a registry token works with its issuer's ECR permissions. Tokens handed
  # to K3s Agents (api) and GKE pull Secrets (worker) are minted with this role, so whoever reads
  # the cluster Secret can pull from this repository only, never push.
  EcrPullRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cmp-demo-ecr-pull
      Description: Pull-only ECR tokens for user clusters (ticket 47)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cmp-demo-ecr-pull
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPullOnly
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt BuildRepository.Arn
      Tags:
        - Key: Project
          Value: cloud-migration-platform
        - Key: Purpose
          Value: hackathon-demo-ecr-pull

  # Ticket 23b (#205), ADR-005: the instance role is the platform principal of environment
  # connections (API CONNECTION_PLATFORM_AWS_PROFILE=cmp-demo-build). Cross-account AssumeRole needs
  # this caller-side allow besides the user's trust policy. A separate inline policy so the build
  # policy keeps its own scope.
  ConnectionAssumePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref InstanceRoleName
      PolicyName: cmp-demo-connections
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Any account (the user's) and any role name (CloudFormation generates it), but only
          # roles carrying the tag both infra/connections templates put on the connection role,
          # and only with a platform-issued External ID (`cmp-` + 32 hex). The tag also keeps
          # same-account roles that merely trust the account root out of reach.
          - Sid: ConnectionAssumeRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/*'
            Condition:
              StringEquals:
                iam:ResourceTag/cmp:managed-by: cloud-migration-platform
              StringLike:
                sts:ExternalId: cmp-*
              'Null':
                sts:ExternalId: 'false'

Outputs:
  RepositoryName:
    Value: !Ref BuildRepository
  RepositoryArn:
    Value: !GetAtt BuildRepository.Arn
  RepositoryUri:
    Value: !GetAtt BuildRepository.RepositoryUri
  BuildPolicyName:
    Value: cmp-demo-build
  PullRoleArn:
    Value: !GetAtt EcrPullRole.Arn
  SourceBucket:
    Value: !Ref DeployBucketName

# CMP demo platform connection principal and template hosting (ticket 46, #181; ADR-005).
# A separate stack: it adds an inline policy to the EXISTING control-plane instance role and never
# updates cmp-demo-control-plane (ticket 28 D1: that update would change the public IP).
#   - ConnectorRole `cmp-platform-connector`: the fixed-name principal users trust in their
#     connection role templates (B-16). The instance role assumes it; it can only assume
#     platform-tagged `cmp-*` roles with an External ID (B-02).
#   - TemplateBucket: public-read `connections/*` so CloudFormation quick-create can read
#     infra/connections/*.yaml (B-05). Templates hold no secret.
# Long-form intrinsics only, so the file is plain YAML (tests/test_connection_credentials.py).
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CMP demo connection principal (cmp-platform-connector) and connection template bucket
  (ticket 46). Never updates cmp-demo-control-plane.
Parameters:
  InstanceRoleName:
    Type: String
    Description: Name of the existing demo EC2 instance role (cmp-demo-control-plane InstanceRole).
    AllowedPattern: "^[\\w+=,.@-]{1,64}$"
  TemplateBucketName:
    Type: String
    Description: New bucket for the public connection templates (cmp-demo-<account>-apne2-connections).
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
Resources:
  ConnectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cmp-platform-connector
      Description: CMP platform principal that assumes user connection roles (External ID required)
      # Generated connection profiles chain through this role; chained sessions last at most 1 h.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DemoInstanceRole
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cmp-assume-connection-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AssumePlatformConnectionRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:iam::*:role/cmp-*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/cmp:managed-by: cloud-migration-platform
                  StringLike:
                    sts:ExternalId: cmp-*
      Tags:
        - Key: Project
          Value: cloud-migration-platform
        - Key: Purpose
          Value: hackathon-demo-connections
  InstanceAssumesConnector:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName:
        Ref: InstanceRoleName
      PolicyName: cmp-demo-connector
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeConnector
            Effect: Allow
            Action: sts:AssumeRole
            Resource:
              Fn::GetAtt: [ConnectorRole, Arn]
  TemplateBucket:
    Type: AWS::S3::Bucket
    # Users' stacks keep pointing at these URLs; never delete them with the stack.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Ref: TemplateBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Project
          Value: cloud-migration-platform
        - Key: Purpose
          Value: hackathon-demo-connections
  TemplateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: TemplateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadConnectionTemplates
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource:
              Fn::Sub: "${TemplateBucket.Arn}/connections/*"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - Fn::GetAtt: [TemplateBucket, Arn]
              - Fn::Sub: "${TemplateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
Outputs:
  PlatformPrincipalArn:
    Description: CONNECTION_PLATFORM_PRINCIPAL_ARN (PlatformPrincipalArn in user templates)
    Value:
      Fn::GetAtt: [ConnectorRole, Arn]
  TemplateBucket:
    Value:
      Ref: TemplateBucket
  TemplateBaseUrl:
    Description: CONNECTION_TEMPLATE_BASE_URL
    Value:
      Fn::Sub: "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/connections/v1"

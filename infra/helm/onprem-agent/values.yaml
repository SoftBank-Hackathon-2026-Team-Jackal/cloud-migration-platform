# Required: the Agent ID the operator used when issuing the enrollment token.
agentId: ""

platform:
  # HTTPS only (the Agent rejects plain HTTP to non-loopback hosts).
  url: ""
  # Optional PEM bundle for a private CA that signed the platform certificate.
  caBundle: ""

# One-time enrollment token. Needed only for the first install; after registration the Agent
# stores its credential in the `cmp-agent-credential` Secret (not managed by Helm) and deletes
# the token Secret. Leave empty on `helm upgrade`.
enrollmentToken: ""

image:
  repository: ghcr.io/softbank-hackathon-2026-team-jackal/cmp-onprem-agent
  # Releases pin the digest. `tag` is for local builds only and is used when digest is empty.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

# Ticket 42 (#177): Secrets (kubernetes.io/dockerconfigjson, same Namespace) used to pull the Agent
# image when the GHCR package is not public. Empty by default: public packages need no credential.
# The Chart only references existing Secrets and never takes registry credentials as values.
#   imagePullSecrets:
#     - name: cmp-agent-ghcr
imagePullSecrets: []

# Ticket 52 (D13, C-08): outbound HTTPS proxy for platform calls (agent and tunnel containers).
# Empty: no proxy variables are set. `noProxy` keeps the cluster API and Services direct
# (kubectl honours CIDRs; K3s default Pod/Service CIDRs). WireGuard (UDP) never uses the proxy.
proxy:
  https: ""
  http: ""
  noProxy: localhost,127.0.0.1,.svc,.cluster.local,10.42.0.0/16,10.43.0.0/16

helmTimeout: 5m
idleSeconds: 2
# Must exceed the longest Helm step (helm --wait is bounded by 900s in the Agent).
terminationGracePeriodSeconds: 960

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# MNP-01 (#51, N3): probe image for NETWORK_PREFLIGHT jobs (needs psql, nc, getent, ip, timeout).
# Must be pinned by digest. Ticket 52 (D12, N13): defaults to the official public
# postgres 16.15-alpine3.24 multi-arch index (amd64/arm64) verified by MNP-01 on k3d, so a plain
# install runs preflight. Override with a mirror digest when Docker Hub is unreachable/limited.
# Empty: the Agent refuses preflight jobs with PREFLIGHT_NOT_CONFIGURED and the Chart grants no
# Pod create/delete for it.
networkPreflight:
  image: docker.io/library/postgres@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
  # Digest-pinned images the Agent may run; empty means just `image`.
  allowedImages: []

# Ticket 17 (#71): WireGuard client + tunnel-IP-only forwarders (decisions W1~W9).
tunnel:
  enabled: true
  # auto: kernel WireGuard, else wireguard-go (needs /dev/net/tun). kernel | userspace to pin.
  mode: auto
  # Config poll, health checks and status report interval.
  intervalSeconds: 5
  # Ticket 73 (ADR-007 step 2): let the platform's data worker reach this cluster's K3s API
  # through the tunnel (port named by the platform, forwarded to `kubernetes.default.svc:443`,
  # relay address only). Off: the Agent ignores the port. TLS and authentication stay end to end.
  exposeKubeApi: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

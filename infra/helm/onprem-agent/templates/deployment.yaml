apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Never run two Agents at once while the Pod is replaced.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cmp-onprem-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "agent.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agent.name" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --platform-url
            - {{ .Values.platform.url | quote }}
            - --agent-id
            - {{ .Values.agentId | quote }}
            - --in-cluster
            - --namespace
            - {{ .Release.Namespace | quote }}
            - --helm-timeout
            - {{ .Values.helmTimeout | quote }}
            - --idle-seconds
            - {{ .Values.idleSeconds | quote }}
            {{- with .Values.networkPreflight.image }}
            - --preflight-image
            - {{ . | quote }}
            - --preflight-allowed-images
            - {{ join "," ($.Values.networkPreflight.allowedImages | default (list .)) | quote }}
            {{- end }}
          env:
            - name: HOME
              value: /tmp
            {{- if .Values.platform.caBundle }}
            - name: SSL_CERT_FILE
              value: /etc/cmp-agent/ca/ca.crt
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.platform.caBundle }}
            - name: platform-ca
              mountPath: /etc/cmp-agent/ca
              readOnly: true
            {{- end }}
        {{- if .Values.tunnel.enabled }}
        # Ticket 17 (W1): WireGuard client in the Pod network namespace (no hostNetwork). Root
        # only for NET_ADMIN (interface/peer) and NET_BIND_SERVICE (app ports < 1024); every other
        # capability is dropped. Forwarders bind to the tunnel IP only; no container port is open.
        - name: tunnel
          image: {{ include "agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "cmp_providers.agent_tunnel"]
          args:
            - --platform-url
            - {{ .Values.platform.url | quote }}
            - --agent-id
            - {{ .Values.agentId | quote }}
            - --namespace
            - {{ .Release.Namespace | quote }}
            - --mode
            - {{ .Values.tunnel.mode | quote }}
            - --interval-seconds
            - {{ .Values.tunnel.intervalSeconds | quote }}
          env:
            - name: HOME
              value: /tmp
            {{- if .Values.platform.caBundle }}
            - name: SSL_CERT_FILE
              value: /etc/cmp-agent/ca/ca.crt
            {{- end }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_BIND_SERVICE"]
          resources:
            {{- toYaml .Values.tunnel.resources | nindent 12 }}
          volumeMounts:
            - name: tunnel-tmp
              mountPath: /tmp
            - name: wireguard-run
              mountPath: /var/run/wireguard
            {{- if ne .Values.tunnel.mode "kernel" }}
            - name: tun
              mountPath: /dev/net/tun
            {{- end }}
            {{- if .Values.platform.caBundle }}
            - name: platform-ca
              mountPath: /etc/cmp-agent/ca
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.tunnel.enabled }}
        - name: tunnel-tmp
          emptyDir: {}
        - name: wireguard-run
          emptyDir: {}
        {{- if ne .Values.tunnel.mode "kernel" }}
        # wireguard-go fallback only (kernel WireGuard needs no device).
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
        {{- end }}
        {{- if .Values.platform.caBundle }}
        - name: platform-ca
          configMap:
            name: cmp-agent-platform-ca
        {{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Never run two Agents at once while the Pod is replaced.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cmp-onprem-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "agent.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agent.name" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --platform-url
            - {{ .Values.platform.url | quote }}
            - --agent-id
            - {{ .Values.agentId | quote }}
            - --in-cluster
            - --namespace
            - {{ .Release.Namespace | quote }}
            - --helm-timeout
            - {{ .Values.helmTimeout | quote }}
            - --idle-seconds
            - {{ .Values.idleSeconds | quote }}
          env:
            - name: HOME
              value: /tmp
            {{- if .Values.platform.caBundle }}
            - name: SSL_CERT_FILE
              value: /etc/cmp-agent/ca/ca.crt
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.platform.caBundle }}
            - name: platform-ca
              mountPath: /etc/cmp-agent/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.platform.caBundle }}
        - name: platform-ca
          configMap:
            name: cmp-agent-platform-ca
        {{- end }}

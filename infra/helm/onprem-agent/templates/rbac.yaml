# Explicit resources and verbs only (ticket 15, H2). Target Namespaces are created at rollout
# time, so this is cluster-scoped; the Agent refuses Namespaces it does not own
# (cmp.dev/environment-id annotation) before any change. Ticket 52 (D16): no `watch` (the Agent
# waits itself since 51 and only gets/lists); a Namespace-scoped Role mode is a follow-up.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent.clusterName" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    # list: the tunnel finds forward targets in Agent-owned Namespaces (ticket 17 W2).
    # delete: environment teardown with delete_data, owned Namespaces only (ticket 52 D8).
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  # Helm release records, DB password Secret, Agent credential; teardown removes managed ones.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Ticket 29 (I8): link the platform ECR pull Secret to the Namespace `default`
  # ServiceAccount (create only when the controller has not made it yet).
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "endpoints", "events"]
    verbs: ["get", "list"]
  # Ticket 51: a StatefulSet stays blocked on a never-Ready Pod of a failed revision even after
  # rollback; the Agent deletes only such Pods of its managed DB StatefulSet (never Ready ones).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  # Ticket 26: approved NetworkPolicies in Agent-owned Namespaces (managed label only).
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # READY checks: pg_isready inside the DB Pod and the app health path via the API proxy.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
  # Provisioning 84: in each Namespace it creates, bind the data migration worker's ClusterRole
  # (made by make-data-kubeconfig.py) so the binding lives and dies with the Namespace. `bind` on
  # that one ClusterRole lets the Agent grant it without holding every permission it contains.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["cmp-data-migration-db"]
  {{- if .Values.networkPreflight.image }}
  # MNP-01 (N2/N3): short-lived probe Pod in the replication Namespace plus a read-only
  # hostNetwork Pod running `ip route get` on the same node; the Agent creates them only in
  # Namespaces it owns (cmp.dev/environment-id), reads their one-line log and deletes them.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent.clusterName" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent.name" . }}
    namespace: {{ .Release.Namespace }}

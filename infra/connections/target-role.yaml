# Cloud Migration Platform - target (EKS new build) connection role. Tickets 23, 47; ADR-005.
# Created by the user in the target AWS account from the platform's quick-create link.
# Trust: the platform principal with the platform-issued External ID only.
# Scope (v2, ticket 47; reviewed call list: packages/providers/src/cmp_providers/aws_target_access.py):
#   - EC2 creates carry the Terraform tag in the request (aws:RequestTag/cmp:managed-by) and may
#     only use parents (VPC, subnet, Elastic IP) that already carry it; tags can be added at
#     creation only (ec2:CreateAction), never to a user's existing resource,
#   - EC2 changes/deletes only on resources carrying that tag (aws:ResourceTag/cmp:managed-by),
#   - EKS writes only on clusters named with ResourcePrefix that carry the tag; user kubectl access
#     is STANDARD access entries with the cluster admin policy only,
#   - IAM writes/reads only on roles/policies named with ResourcePrefix and EKS OIDC providers;
#     only the reviewed AWS managed policies (or prefixed ones) can be attached; no inline policy;
#     PassRole only to EKS/EC2,
#   - explicit deny for IAM users, access keys, the platform connection tag on any role, instance
#     user data, and changes to this role itself.
# Checked offline (tests/test_aws_target_access.py) and with IAM simulate-custom-policy
# (infra/connections/simulate-target-role.py). A real Apply with this role is still unverified.
AWSTemplateFormatVersion: "2010-09-09"
Description: Cloud Migration Platform target build role (cross-account AssumeRole with External ID)
Parameters:
  PlatformPrincipalArn:
    Type: String
    Description: ARN of the platform principal allowed to assume this role (shown by the platform)
    AllowedPattern: "^arn:aws(-cn|-us-gov)?:iam::[0-9]{12}:role/.+$"
  ExternalId:
    Type: String
    Description: External ID issued by the platform for this connection (do not change)
    AllowedPattern: "^cmp-[0-9a-f]{32}$"
  ResourcePrefix:
    Type: String
    Default: cmp-
    Description: Name prefix of the clusters and IAM roles/policies the platform's Terraform creates
    AllowedValues:
      - cmp-
  ManagedByTag:
    Type: String
    Default: terraform
    Description: Value of the cmp:managed-by tag the platform's Terraform puts on every resource
Resources:
  ConnectionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Cloud Migration Platform target build role
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PlatformWithExternalId
            Effect: Allow
            Principal:
              AWS:
                Ref: PlatformPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      Tags:
        - Key: cmp:managed-by
          Value: cloud-migration-platform
        - Key: cmp:connection-role
          Value: target
  TargetBuild:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Create and manage only platform-tagged VPC network resources
      Roles:
        - Ref: ConnectionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Read-only. ec2:Describe* keeps provider refresh working across versions; user data is
          # denied below. ELB reads let cleanup find load balancers the controller created.
          - Sid: ReadNetwork
            Effect: Allow
            Action:
              - ec2:Describe*
              - elasticloadbalancing:Describe*
              - sts:GetCallerIdentity
            Resource: "*"
          # New resources carry the Terraform tag. One statement per group so that a parent type
          # (vpc, subnet, elastic-ip) never passes on the request tag alone.
          - Sid: CreateTaggedNetwork
            Effect: Allow
            Action:
              - ec2:AllocateAddress
              - ec2:CreateInternetGateway
              - ec2:CreateVpc
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:elastic-ip/*"
              - Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:internet-gateway/*"
              - Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/*"
            Condition:
              StringEquals:
                aws:RequestTag/cmp:managed-by:
                  Ref: ManagedByTag
          - Sid: CreateTaggedInVpc
            Effect: Allow
            Action:
              - ec2:CreateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:CreateSubnet
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:route-table/*"
              - Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*"
              - Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*"
            Condition:
              StringEquals:
                aws:RequestTag/cmp:managed-by:
                  Ref: ManagedByTag
          - Sid: CreateTaggedNatGateway
            Effect: Allow
            Action: ec2:CreateNatGateway
            Resource:
              Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:natgateway/*"
            Condition:
              StringEquals:
                aws:RequestTag/cmp:managed-by:
                  Ref: ManagedByTag
          - Sid: CreateInTaggedParents
            Effect: Allow
            Action:
              - ec2:CreateNatGateway
              - ec2:CreateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:CreateSubnet
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:elastic-ip/*"
              - Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:subnet/*"
              - Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/*"
            Condition:
              StringEquals:
                aws:ResourceTag/cmp:managed-by:
                  Ref: ManagedByTag
          # Tags only as part of the create call above, never on an existing resource.
          - Sid: TagOnCreate
            Effect: Allow
            Action: ec2:CreateTags
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/cmp:managed-by:
                  Ref: ManagedByTag
                ec2:CreateAction:
                  - AllocateAddress
                  - AuthorizeSecurityGroupEgress
                  - AuthorizeSecurityGroupIngress
                  - CreateInternetGateway
                  - CreateNatGateway
                  - CreateRouteTable
                  - CreateSecurityGroup
                  - CreateSubnet
                  - CreateVpc
          - Sid: ChangeTagged
            Effect: Allow
            Action:
              - ec2:AssociateRouteTable
              - ec2:AttachInternetGateway
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:CreateRoute
              - ec2:CreateTags
              - ec2:DeleteInternetGateway
              - ec2:DeleteNatGateway
              - ec2:DeleteRoute
              - ec2:DeleteRouteTable
              - ec2:DeleteSecurityGroup
              - ec2:DeleteSubnet
              - ec2:DeleteTags
              - ec2:DeleteVpc
              - ec2:DetachInternetGateway
              - ec2:DisassociateAddress
              - ec2:DisassociateRouteTable
              - ec2:ModifySubnetAttribute
              - ec2:ModifyVpcAttribute
              - ec2:ReleaseAddress
              - ec2:RevokeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
            Resource: "*"
            Condition:
              StringEquals:
                aws:ResourceTag/cmp:managed-by:
                  Ref: ManagedByTag
          # Sub-resources AWS also authorizes these calls against. They are never tagged, and the
          # same call still needs the tagged security group / Elastic IP above.
          - Sid: SubResourcesOfTagged
            Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:DisassociateAddress
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group-rule/*"
              - Fn::Sub: "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:network-interface/*"
          - Sid: NeverUserData
            Effect: Deny
            Action:
              - ec2:DescribeInstanceAttribute
              - ec2:DescribeLaunchTemplateVersions
            Resource: "*"
  # Second policy: one managed policy is limited to 6,144 characters (ticket 47).
  TargetCluster:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Create and manage only platform-named EKS clusters and IAM roles/policies
      Roles:
        - Ref: ConnectionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadEksAccount
            Effect: Allow
            Action:
              - eks:DescribeAddonConfiguration
              - eks:DescribeAddonVersions
              - eks:DescribeClusterVersions
              - eks:ListAccessPolicies
              - eks:ListClusters
            Resource: "*"
          - Sid: ReadPlatformEks
            Effect: Allow
            Action:
              - eks:Describe*
              - eks:List*
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:nodegroup/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:addon/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:access-entry/${ResourcePrefix}*"
          - Sid: ReadPlatformIam
            Effect: Allow
            Action:
              - iam:GetOpenIDConnectProvider
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListInstanceProfilesForRole
              - iam:ListOpenIDConnectProviderTags
              - iam:ListPolicyTags
              - iam:ListPolicyVersions
              - iam:ListRolePolicies
              - iam:ListRoleTags
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/oidc.eks.*"
          - Sid: CreateTaggedCluster
            Effect: Allow
            Action: eks:CreateCluster
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/cmp:managed-by:
                  Ref: ManagedByTag
          - Sid: ChangePlatformEks
            Effect: Allow
            Action:
              - eks:CreateAddon
              - eks:CreateNodegroup
              - eks:DeleteAccessEntry
              - eks:DeleteAddon
              - eks:DeleteCluster
              - eks:DeleteNodegroup
              - eks:DisassociateAccessPolicy
              - eks:UpdateAccessEntry
              - eks:UpdateAddon
              - eks:UpdateClusterConfig
              - eks:UpdateClusterVersion
              - eks:UpdateNodegroupConfig
              - eks:UpdateNodegroupVersion
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:nodegroup/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:addon/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:access-entry/${ResourcePrefix}*"
            Condition:
              StringEquals:
                aws:ResourceTag/cmp:managed-by:
                  Ref: ManagedByTag
          # Tags on the platform's own EKS resources only (also used while creating them).
          - Sid: TagPlatformEks
            Effect: Allow
            Action:
              - eks:TagResource
              - eks:UntagResource
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:nodegroup/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:addon/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:access-entry/${ResourcePrefix}*"
          # Ticket 47 (B-10): the user's kubectl access to the new cluster.
          - Sid: UserAccessEntries
            Effect: Allow
            Action: eks:CreateAccessEntry
            Resource:
              Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/${ResourcePrefix}*"
            Condition:
              StringEquals:
                aws:ResourceTag/cmp:managed-by:
                  Ref: ManagedByTag
                eks:accessEntryType: STANDARD
          - Sid: UserAccessAdminPolicyOnly
            Effect: Allow
            Action: eks:AssociateAccessPolicy
            Resource:
              Fn::Sub: "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:access-entry/${ResourcePrefix}*"
            Condition:
              StringEquals:
                aws:ResourceTag/cmp:managed-by:
                  Ref: ManagedByTag
                eks:policyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          - Sid: PlatformIamOnly
            Effect: Allow
            Action:
              - iam:CreateOpenIDConnectProvider
              - iam:CreatePolicy
              - iam:CreatePolicyVersion
              - iam:CreateRole
              - iam:DeleteOpenIDConnectProvider
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:TagOpenIDConnectProvider
              - iam:TagPolicy
              - iam:TagRole
              - iam:UntagOpenIDConnectProvider
              - iam:UntagPolicy
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateOpenIDConnectProviderThumbprint
            Resource:
              - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${ResourcePrefix}*"
              - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/oidc.eks.*"
          - Sid: AttachReviewedPoliciesOnly
            Effect: Allow
            Action: iam:AttachRolePolicy
            Resource:
              Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ResourcePrefix}*"
            Condition:
              ArnLike:
                iam:PolicyARN:
                  - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy"
                  - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy"
                  - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy"
                  - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly"
                  - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy"
                  - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${ResourcePrefix}*"
          - Sid: PassPlatformRolesToEks
            Effect: Allow
            Action: iam:PassRole
            Resource:
              Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ResourcePrefix}*"
            Condition:
              StringEquals:
                iam:PassedToService:
                  - eks.amazonaws.com
                  - ec2.amazonaws.com
          - Sid: EksServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: "*"
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - eks.amazonaws.com
                  - eks-nodegroup.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
          - Sid: NeverLongLivedCredentialsOrSelfChange
            Effect: Deny
            Action:
              - iam:CreateAccessKey
              - iam:CreateLoginProfile
              - iam:CreateUser
              - iam:UpdateAccessKey
            Resource: "*"
          # The platform principal may assume roles carrying this tag (its AssumeRole policy);
          # never let the platform mint such a role in the user's account.
          - Sid: NeverPlatformConnectionTag
            Effect: Deny
            Action:
              - iam:CreateRole
              - iam:TagRole
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/cmp:managed-by: cloud-migration-platform
          - Sid: NeverChangeThisRole
            Effect: Deny
            Action:
              - iam:AttachRolePolicy
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePermissionsBoundary
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
            Resource:
              Fn::GetAtt: [ConnectionRole, Arn]
Outputs:
  RoleArn:
    Description: Register this Role ARN on the platform connection page
    Value:
      Fn::GetAtt: [ConnectionRole, Arn]

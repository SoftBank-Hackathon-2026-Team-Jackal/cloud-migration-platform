node: { id: lab-envoy-1, cluster: lab }
admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 9901 } }
static_resources:
  listeners:
  - name: ingress
    address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          rds:
            route_config_name: local_route
            config_source:
              resource_api_version: V3
              path_config_source:
                path: /etc/envoy/rds/rds.json
                watched_directory: { path: /etc/envoy/rds }
          http_filters:
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
  - name: cluster_origin
    type: STRICT_DNS
    connect_timeout: 1s
    health_checks:
    - { timeout: 1s, interval: 1s, unhealthy_threshold: 2, healthy_threshold: 2, http_health_check: { path: /health } }
    load_assignment:
      cluster_name: cluster_origin
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: backend-origin, port_value: 8000 } } } } ] } ]
  - name: cluster_target
    type: STRICT_DNS
    connect_timeout: 1s
    health_checks:
    - { timeout: 1s, interval: 1s, unhealthy_threshold: 2, healthy_threshold: 2, http_health_check: { path: /health } }
    load_assignment:
      cluster_name: cluster_target
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: backend-target, port_value: 8000 } } } } ] } ]

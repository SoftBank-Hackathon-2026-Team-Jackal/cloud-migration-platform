# 데이터 이전 로컬 실습용 DB. 원본은 데모 chat-source(EKS)와, 대상은 플랫폼 postgres 차트와 같은 모양이다.
# 컨테이너 이름 postgres, 환경변수 POSTGRES_DB/USER/PASSWORD, PostgreSQL 16.
# 사용: WAL_ARGS 자리를 원본은 wal_level=logical로, 대상은 비워 둔다(run.sh가 채움).
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
stringData:
  password: lab-only-password
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector: {app: db}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          args: [WAL_ARGS]
          env:
            - {name: POSTGRES_DB, value: chat}
            - {name: POSTGRES_USER, value: chat}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: db-secret, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 2
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
# 다른 클러스터의 DB가 이 DB에 접속하는 입구. 실제 환경에서는 WireGuard 터널 주소가 이 자리다(DM-011).
apiVersion: v1
kind: Service
metadata:
  name: db-peer
spec:
  type: NodePort
  selector: {app: db}
  ports: [{name: postgres, port: 5432, targetPort: 5432, nodePort: 30432}]

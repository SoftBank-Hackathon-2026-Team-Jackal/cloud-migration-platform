# 실습용 원본 앱(loadgen). 데모 chat 앱처럼 Secret chat-secrets의 DATABASE_URL로 DB에 붙는다.
apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
stringData:
  DATABASE_URL: postgresql://chat:lab-only-password@db.data-lab.svc:5432/chat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-app
spec:
  replicas: 1
  selector: {matchLabels: {app: chat-app}}
  template:
    metadata: {labels: {app: chat-app}}
    spec:
      containers:
        - name: app
          image: cmp-data-cutover:dev
          imagePullPolicy: IfNotPresent
          command: [python3, /app/loadgen.py]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: chat-secrets, key: DATABASE_URL}}
          volumeMounts: [{name: code, mountPath: /app}]
      volumes:
        - name: code
          configMap: {name: loadgen}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/secret/userlist.txt
admin_users = cmp_admin
; 트랜잭션 모드여야 PAUSE가 진행 중인 트랜잭션만 기다리고 빨리 끝난다
pool_mode = transaction
default_pool_size = 20
max_client_conn = 500
; PAUSE 동안 클라이언트가 기다릴 수 있는 최대 시간
query_wait_timeout = 60
server_reset_query =
ignore_startup_parameters = extra_float_digits,options

; 전환 실행기가 이 파일의 연결 대상을 바꾸고 RELOAD 한다. 처음 값은 Secret(route)에서 복사한다
%include /etc/pgbouncer/runtime/databases.ini

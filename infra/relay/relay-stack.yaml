AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CMP demo relay host (Envoy + WireGuard, #200). A separate stack: it never updates
  cmp-demo-control-plane or cmp-demo-build. Server setup runs afterwards through SSM (setup-relay.sh).

Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  VpcId:
    Type: AWS::EC2::VPC::Id
  InstanceType:
    Type: String
    Default: t3.micro
  WireGuardPort:
    Type: Number
    Default: 51820
  WireGuardSourceCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >-
      Who may send WireGuard UDP. The on-premises Agent public IP is not known in advance and the
      tunnel is key-authenticated; narrow this when the IP is known.
  UserPort:
    Type: Number
    Default: 8080

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      # Administration through SSM only; the host needs no other AWS permission.
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # GroupDescription must not change: it forces the security group to be replaced.
      GroupDescription: CMP demo relay; WireGuard UDP and user HTTP only. No SSH, no Envoy admin port (9901).
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: udp
          FromPort: !Ref WireGuardPort
          ToPort: !Ref WireGuardPort
          CidrIp: !Ref WireGuardSourceCidr
          Description: WireGuard tunnel from the on-premises Agent
        - IpProtocol: tcp
          FromPort: !Ref UserPort
          ToPort: !Ref UserPort
          CidrIp: 0.0.0.0/0
          Description: User traffic into the Envoy relay
        # #TLS: HTTPS in front of the relay. Caddy (setup-tls.sh) answers on 443 with a certificate for
        # <public-ip>.sslip.io and forwards to Envoy on the user port; port 80 is the certificate
        # challenge and the redirect to HTTPS. The plain user port stays open, so nothing that worked breaks.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to the relay (Caddy, then Envoy)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Certificate challenge and redirect to HTTPS
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: cmp-demo-relay

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        # Envoy runs with host networking, so the default hop limit is enough.
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: cmp-demo-relay
        - Key: Project
          Value: cloud-migration-platform
        - Key: Purpose
          Value: hackathon-demo-relay

  PublicAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - Key: Project
          Value: cloud-migration-platform
        - Key: Purpose
          Value: hackathon-demo-relay

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !Ref PublicAddress
  WireGuardPort:
    Value: !Ref WireGuardPort
  UserPort:
    Value: !Ref UserPort

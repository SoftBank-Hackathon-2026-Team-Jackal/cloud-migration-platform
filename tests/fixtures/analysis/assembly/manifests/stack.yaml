apiVersion: apps/v1
kind: Deployment
metadata:
  name: Shop API
  namespace: shop
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: api
          image: registry.example.com/shop-api:1.4.0
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shop-db
  namespace: shop
spec:
  replicas: 1
  volumeClaimTemplates:
    - metadata: {name: pgdata}
      spec:
        resources:
          requests: {storage: 20Gi}
  template:
    spec:
      containers:
        - name: postgres
          image: postgres:16.2
          ports:
            - containerPort: 5432
          resources:
            requests: {cpu: 250m, memory: 512Mi}
          env:
            - name: POSTGRES_DB
              value: shopdb
            - name: POSTGRES_USER
              value: shopuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: shop-db-secret, key: password}

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-migration-platform"
version = "0.1.0"
description = "Cloud migration control plane scaffold"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "temporalio>=1.8,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.8,<1", "pyyaml>=6,<7"]

[tool.setuptools]
packages = [
  "cmp_api", "cmp_api.routes", "cmp_worker", "cmp_worker.workflows",
  "cmp_worker.activities", "cmp_worker.workers", "cmp_contracts", "cmp_providers", "cmp_scanners",
]

[tool.setuptools.package-dir]
cmp_api = "apps/api/src/cmp_api"
cmp_worker = "apps/worker/src/cmp_worker"
cmp_contracts = "packages/contracts/src/cmp_contracts"
cmp_providers = "packages/providers/src/cmp_providers"
cmp_scanners = "packages/scanners/src/cmp_scanners"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

